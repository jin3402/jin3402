name: blog-posts

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://jin3402.github.io/feed.xml"
          max_post_count: 5
          template: "- [$title]($url) `$date` $newline"
          date_format: "yyyy-mm-dd"
          commit_message: "Update blog posts"
